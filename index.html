<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống Gửi Thư Mời Sự Kiện - An Việt</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #e9ecef; padding: 20px; margin: 0; }
    .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #0056b3; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; margin-top: 0; }
    .section { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    .section-title { font-size: 15px; font-weight: bold; color: #333; margin-bottom: 15px; text-transform: uppercase; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
    input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
    input[type="color"] { width: 100%; height: 40px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 2px; }
    button { background: #0056b3; color: white; border: none; padding: 15px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #004494; }
    button:disabled { background: #999; cursor: not-allowed; }
    #progressBar { width: 100%; height: 25px; margin-top: 10px; border-radius: 4px; }
    .status { margin-top: 15px; font-weight: bold; color: #333; text-align: center; }
    .log-box { width: 100%; height: 180px; overflow-y: scroll; background: #212529; color: #33ff33; border-radius: 4px; padding: 12px; font-size: 13px; margin-top: 15px; font-family: monospace; box-sizing: border-box; line-height: 1.5; }
    @media (max-width: 768px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Hệ thống Gửi Thư Mời Tự Động</h2>
    
    <div class="section">
      <div class="section-title">1. Cấu hình Dữ liệu</div>
      <div class="grid-2">
        <div class="form-group">
          <label>Link thư mục Google Drive (chứa ảnh thư mời riêng):</label>
          <input type="text" id="driveId" placeholder="Dán nguyên đường link thư mục Drive vào đây...">
        </div>
        <div class="form-group">
          <label>File Data (CSV) - Cột: Email, Họ tên, Chức danh, Phòng, Khối, Tên ảnh</label>
          <input type="file" id="csvUpload" accept=".csv" style="padding: 6px 0;">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">2. Tùy chỉnh Giao diện (Màu & Logo)</div>
      <div class="grid-3">
        <div class="form-group">
          <label>Màu nền Tiêu đề (Top bar):</label>
          <input type="color" id="bgHeader" value="#1a2b4c">
        </div>
        <div class="form-group">
          <label>Màu nền Tổng (Bên ngoài):</label>
          <input type="color" id="bgMain" value="#f4f6f9">
        </div>
        <div class="form-group">
          <label>Màu nền Nội dung (Khối text):</label>
          <input type="color" id="bgContent" value="#cafffb">
        </div>
      </div>
      <div class="form-group">
        <label>Upload Logo Sự Kiện (PNG nền trong suốt):</label>
        <input type="file" id="logoUpload" accept="image/*">
      </div>
    </div>

    <div class="section">
      <div class="section-title">3. Tùy chỉnh Nội dung Email</div>
      <div class="form-group">
        <label>Tiêu đề gửi Email (Subject):</label>
        <input type="text" id="subject" placeholder="[An Việt] Thư mời tham dự Year End Party 2026">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Tiêu đề trên Logo:</label>
          <input type="text" id="titleLogo" value="THƯ MỜI THAM DỰ SỰ KIỆN">
        </div>
        <div class="form-group">
          <label>Tên Sự kiện (Hiển thị trong nội dung):</label>
          <input type="text" id="eventName" value="YEAR END PARTY 2026 - IGNITE THE SKY">
        </div>
      </div>
      <div class="form-group">
        <label>Nội dung thư mời chung:</label>
        <textarea id="mainContent" rows="4" placeholder="Nhập nội dung thư... Các dòng sẽ tự động được giữ nguyên định dạng xuống dòng."></textarea>
      </div>
      <div class="grid-3">
        <div class="form-group">
          <label>Thời gian (VD: 00:00):</label>
          <input type="text" id="timeText" value="18:00">
        </div>
        <div class="form-group">
          <label>Địa điểm:</label>
          <textarea id="locationText" rows="2" style="font-size:13px;">HA LONG BAY&#10;Địa chỉ chi tiết</textarea>
        </div>
        <div class="form-group">
          <label>Ngày tháng:</label>
          <textarea id="dateText" rows="2" style="font-size:13px;">THỨ 7&#10;12.12.2026</textarea>
        </div>
      </div>
    </div>

    <button id="sendBtn" onclick="startSending()">🚀 CHẠY HỆ THỐNG GỬI MAIL</button>

    <div class="status">
      Tiến độ gửi: <span id="progressText">0 / 0</span>
      <progress id="progressBar" value="0" max="100"></progress>
    </div>
    <div id="logBox" class="log-box">Hệ thống sẵn sàng...</div>
  </div>

  <script>
    // URL Web App Google Apps Script của bạn
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzqmOUe_SMkZTuqze2q0xuQ_vAxhIlG7FGNL8NqN4kfvPl7cyywlTuzaiOLmCR5KPgP2Q/exec";

    let logoBase64 = "";
    let logoMime = "";

    // Đọc file Logo sang Base64
    document.getElementById('logoUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        logoMime = file.type;
        const reader = new FileReader();
        reader.onload = function(evt) { logoBase64 = evt.target.result; };
        reader.readAsDataURL(file);
      }
    });

    // Template HTML nhúng sẵn
    const emailLayout = `
    <div style="background-color: {{Bg_Main}}; padding: 20px; font-family: 'Segoe UI', Arial, sans-serif;">
      <table align="center" width="100%" style="max-width: 800px; background-color: #ffffff; margin: auto; border-collapse: collapse; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        <tr>
          <td style="background-color: {{Bg_Header}}; color: #ffffff; padding: 15px 30px; font-size: 14px;">
            <table width="100%" style="color: #ffffff;">
              <tr>
                <td align="left" style="font-weight: 500;">AN VIỆT HOMES &nbsp;&nbsp;&nbsp; AN VIỆT PROPERTY</td>
                <td align="right" style="font-weight: 500;">THƯ MỜI THAM DỰ</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding: 40px 20px 20px;">
            <h2 style="margin: 0 0 20px 0; font-size: 22px; color: #111;">{{Title_Logo}}</h2>
            <img src="cid:logo_event" style="max-width: 80%; height: auto;" alt="Event Logo" />
          </td>
        </tr>
        <tr>
          <td style="padding: 10px 40px 30px;">
            <div style="background-color: {{Bg_Content}}; border-radius: 16px; padding: 30px; font-size: 15px; color: #111; line-height: 1.6;">
              <p style="margin-top: 0; font-size: 16px;">
                <strong>Trân trọng kính mời: Mr/Ms. {{Ho_Ten}}</strong><br>
                {{Chuc_Danh}} | {{Phong}} | {{Khoi}}
              </p>
              <p style="font-size: 16px;"><strong>Tới tham dự sự kiện {{Event_Name}}</strong></p>
              <div style="white-space: pre-wrap; text-align: justify;">{{Main_Content}}</div>
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding: 10px 40px 30px;">
            <table width="100%" style="text-align: center; font-size: 16px;">
              <tr>
                <td width="30%" style="vertical-align: middle;">
                  <span style="font-size: 32px; font-weight: bold;">{{Time}}</span>
                </td>
                <td width="40%" style="vertical-align: middle; border-left: 2px solid #111; border-right: 2px solid #111; padding: 0 15px;">
                  <div style="font-weight: bold; font-size: 18px; white-space: pre-wrap;">{{Location}}</div>
                </td>
                <td width="30%" style="vertical-align: middle;">
                  <div style="font-size: 24px; font-weight: bold; white-space: pre-wrap; line-height: 1.2;">{{Date}}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding: 0 30px 40px;">
            <img src="cid:thu_moi_image" style="width: 100%; max-width: 740px; border-radius: 16px; display: block;" alt="Thư mời chi tiết" />
          </td>
        </tr>
      </table>
    </div>
    `;

    // Hàm tách cột CSV an toàn (không bị lệch nếu nội dung ô có dấu phẩy)
    function parseCSVLine(text) {
      const result = [];
      let cur = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(cur.trim());
          cur = '';
        } else {
          cur += char;
        }
      }
      result.push(cur.trim());
      return result;
    }

    // Hàm gọi API Google Apps Script qua Fetch
    async function callGasApi(payload) {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      });
      if (!response.ok) {
        throw new Error(`HTTP Error: ${response.status}`);
      }
      return await response.json();
    }

    async function startSending() {
      const rawDriveInput = document.getElementById('driveId').value.trim();
      const folderIdMatch = rawDriveInput.match(/[-\w]{25,}/);
      const driveId = folderIdMatch ? folderIdMatch[0] : rawDriveInput;

      const csvFile = document.getElementById('csvUpload').files[0];
      const subject = document.getElementById('subject').value.trim();
      
      if (!driveId || !csvFile || !logoBase64 || !subject) {
        alert("Vui lòng nhập đủ: Link thư mục Drive, Tiêu đề Email, ảnh Logo và File CSV!");
        return;
      }

      document.getElementById('sendBtn').disabled = true;
      const logBox = document.getElementById('logBox');
      logBox.innerHTML = "Đang khởi tạo mẫu thư và đọc dữ liệu...<br>";

      const preparedTemplate = emailLayout
        .replace(/{{Bg_Header}}/g, document.getElementById('bgHeader').value)
        .replace(/{{Bg_Main}}/g, document.getElementById('bgMain').value)
        .replace(/{{Bg_Content}}/g, document.getElementById('bgContent').value)
        .replace(/{{Title_Logo}}/g, document.getElementById('titleLogo').value)
        .replace(/{{Event_Name}}/g, document.getElementById('eventName').value)
        .replace(/{{Main_Content}}/g, document.getElementById('mainContent').value)
        .replace(/{{Time}}/g, document.getElementById('timeText').value)
        .replace(/{{Location}}/g, document.getElementById('locationText').value)
        .replace(/{{Date}}/g, document.getElementById('dateText').value);

      const reader = new FileReader();
      reader.onload = async function(e) {
        const text = e.target.result;
        const rows = text.split(/\r?\n/).filter(row => row.trim() !== '');
        
        const total = rows.length - 1;
        if (total <= 0) {
          alert("File CSV không có dữ liệu!");
          document.getElementById('sendBtn').disabled = false;
          return;
        }

        document.getElementById('progressBar').max = total;
        let processedCount = 0;

        for (let i = 1; i < rows.length; i++) {
          const cols = parseCSVLine(rows[i]);
          const payload = {
            email: cols[0] || "",
            name: cols[1] || "",
            title: cols[2] || "",
            department: cols[3] || "",
            division: cols[4] || "",
            imageFileName: cols[5] || "",
            driveFolderId: driveId,
            subject: subject,
            preparedHtmlTemplate: preparedTemplate,
            logoBase64: logoBase64,
            logoMime: logoMime
          };

          if (payload.email) {
            logBox.innerHTML += `> [${i}/${total}] Đang gửi: ${payload.name} (${payload.email})...<br>`;
            logBox.scrollTop = logBox.scrollHeight;

            try {
              const res = await callGasApi(payload);
              if (res.success) {
                logBox.innerHTML += `<span style="color:#00ff00">  ✔ Thành công</span><br>`;
              } else {
                logBox.innerHTML += `<span style="color:#ff4444">  ✖ Lỗi: ${res.error}</span><br>`;
              }
            } catch (err) {
              logBox.innerHTML += `<span style="color:#ff4444">  ✖ Lỗi kết nối API: ${err.message}</span><br>`;
            }
          }

          processedCount++;
          document.getElementById('progressBar').value = processedCount;
          document.getElementById('progressText').innerText = `${processedCount} / ${total}`;
          
          // Nghỉ 1 giây giữa mỗi lần gửi
          await new Promise(r => setTimeout(r, 1000));
        }

        logBox.innerHTML += `<br><strong>🏁 HOÀN TẤT CHIẾN DỊCH GỬI ${total} THƯ!</strong><br>`;
        logBox.scrollTop = logBox.scrollHeight;
        document.getElementById('sendBtn').disabled = false;
      };
      reader.readAsText(csvFile);
    }
  </script>
</body>
</html>
